    letter-spacing: 0.4px;
    color: #f0f0f5;
    white-space: pre-line;
  }

    position: absolute;
    right: 24px;
    bottom: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.3; }

  }

function setBackground(node) {
  const overlay = 'linear-gradient(rgba(10, 12, 24, 0.55), rgba(10, 12, 24, 0.72))';

  stageEl.style.backgroundColor = '#141e30';

  if (node.bgImage) {
    stageEl.style.backgroundImage = `${overlay}, url('${node.bgImage}')`;

    stageEl.style.backgroundImage = node.bg || 'linear-gradient(135deg, #141e30 0%, #243b55 100%)';
  }
  stageEl.style.backgroundSize = 'cover';
  stageEl.style.backgroundPosition = 'center';
}

/* 預載所有背景圖，避免切換時空白 */
function preloadImages() {
  Object.values(storyData).forEach(node => {
    if (node.bgImage) {
      const img = new Image();
      img.src = node.bgImage;
    }
  });
}

function typeText(text, callback) {
  textEl.textContent = '';
  currentFullText = text;
  typingCallback = callback;
  isTyping = true;
  let i = 0;

  typingTimer = setInterval(() => {
    textEl.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(typingTimer);
      isTyping = false;
      const cb = typingCallback;
      typingCallback = null;
      cb && cb();
    }
  }, TYPE_SPEED);
}

function finishTyping() {
  if (!isTyping) return;
  clearInterval(typingTimer);
  textEl.textContent = currentFullText;
  isTyping = false;
  const cb = typingCallback;
  typingCallback = null;
  cb && cb();
}

function hideChoices() {
  choicesEl.style.display = 'none';
  choicesEl.innerHTML = '';
  waitingChoice = false;
}

function showChoices(choices) {
  choicesEl.innerHTML = '';
  choicesEl.style.display = 'flex';
  waitingChoice = true;
  hintEl.textContent = '';

  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      hideChoices();
      if (choice.effect && choice.effect.type === 'A') aCount++;
      if (choice.effect && choice.effect.type === 'B') bCount++;
      goTo(choice.next);
    });
    choicesEl.appendChild(btn);
  });
}

function showEnding() {
  let chapter, bg, bgImage, text;

  if (aCount === 3) {
    chapter = '結局一 · 關係受壓';
    bg = 'linear-gradient(135deg, #2a0a0a 0%, #4a1010 100%)';
    bgImage = 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1920&q=80';
    text = `（阿寶經過房門，看見Go婆婆正看手機。Go婆婆立即把螢幕反扣。）

Go婆婆：「冇嘢，你唔使問。」

阿寶旁白：問題好似冇再出現，但其實只係我睇唔到。下一步，我需要先修補關係，亦可能要搵人一齊幫手。

不只問「睇咗幾耐」，也要了解「生活有否受影響」。

  } else if (bCount === 1) {
    chapter = '結局二 · 仍有阻力';
    bg = 'linear-gradient(135deg, #2a1a0a 0%, #4a3010 100%)';
    bgImage = 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1920&q=80';
    text = `Go婆婆：「我有兩晚早咗停，但有晚又睇到一點。」

阿寶（停一停）：「我係有啲擔心，但唔想再關你。邊晚最難停呢係？」

阿寶旁白：改變唔係一條直線。我哋仲要了解難處，而唔係只問做唔做到。

片尾字幕：
不只問「睇咗幾耐」，也要了解「生活有否受影響」。
先理解需要，再共同訂立小改變。
關顧婆婆，也關顧照顧者；遇到持續的健康、財務或家庭衝突問題，不必獨自承擔，可以尋求支援。`;
  } else {
    chapter = '結局三 · 開始合作';
    bg = 'linear-gradient(135deg, #0a2a1a 0%, #104a30 100%)';
    bgImage = 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1920&q=80';
    let prefix = '';
    if (aCount > 0) {
      prefix = `阿寶：「婆婆，之前我語氣重咗，對唔住。我哋再傾過，好唔好？」\n\n`;
    }
    text = `${prefix}Go婆婆：「關咗自動播放，真係易停啲。不過十一點半，我有兩晚都做唔到。」

阿寶：「多謝你肯講。係提示唔清楚，定嗰集啱啱好緊張？」

Go婆婆：「好緊張嗰集。下次提示一響，我試下唔開新一集。」

阿寶：「好，我哋再試。」

（手機彈出新一集通知，Go婆婆看一眼，放下手機。）

Go婆婆：「聽日先。黃太約咗我飲茶。」

阿寶：「好。聽朝你想食乜？」

Go婆婆（笑）：「今次唔求其，我想食...」

阿寶：「收到。」

（阿寶把自己的手機放下，坐到Go婆婆旁邊。）

片尾字幕：
不只問「睇咗幾耐」，也要了解「生活有否受影響」。
先理解需要，再共同訂立小改變。
關顧婆婆，也關顧照顧者；遇到持續的健康、財務或家庭衝突問題，不必獨自承擔，可以尋求支援。`;
  }

  setBackground({ bg, bgImage });
  chapterEl.textContent = chapter;
  speakerEl.textContent = '';
  hideChoices();
  restartBtn.style.display = 'none';
  hintEl.textContent = '';

  typeText(text, () => {
    hintEl.textContent = '—— 完 ——';
    restartBtn.style.display = 'block';
  });
}

function goTo(nodeId) {
  if (nodeId === 'ending') {
    showEnding();
    return;
  }

  const node = storyData[nodeId];
  if (!node) return;

  currentNodeId = nodeId;
  setBackground(node);

  if (node.chapter) chapterEl.textContent = node.chapter;

  speakerEl.textContent = node.speaker || '';
  hideChoices();
  restartBtn.style.display = 'none';
  hintEl.textContent = '';

  typeText(node.text, () => {
    if (node.choices) {
      showChoices(node.choices);
    } else if (node.next) {
      hintEl.textContent = '點擊繼續 ▾';
    } else {
      hintEl.textContent = '—— 完 ——';
      restartBtn.style.display = 'block';
    }
  });
}

stageEl.addEventListener('click', e => {
  if (e.target.closest('#choices') || e.target.closest('#restart-btn')) return;

  if (isTyping) {
    finishTyping();
    return;
  }
  if (waitingChoice) return;

  const node = storyData[currentNodeId];
  if (node && node.next) goTo(node.next);
});

restartBtn.addEventListener('click', e => {
  e.stopPropagation();
  aCount = 0;
  bCount = 0;
  goTo('start');
});

preloadImages();
goTo('start');
</script>
